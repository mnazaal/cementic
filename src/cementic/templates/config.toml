# cementic configuration
#
# Precedence (low -> high): built-in defaults < this file < CEMENTIC_* env vars
# < command-line flags. Every value below is optional; delete what you don't need.

[database]
# Postgres with the pgvector and pgvectorscale extensions. Generate a local
# setup with `cementic init postgres ./cementic-postgres`, then start it with
# `docker compose up -d` (or `podman compose up -d`).
host = "localhost"
port = 5432
name = "cementic"
user = "cementic"
# password = "cementic"   # override outside local development

[pipeline]
embedding_provider = "llama-cpp"
# Counted with tiktoken, while llama_cpp.n_ctx (512) counts the model's own
# tokens -- for the default model one of these is up to 1.33 of the other, so
# chunk_size must stay well under n_ctx or chunks embed truncated. Re-measure
# with scripts/measure_chunk_context_fit.py before raising it.
chunk_size = 320
chunk_overlap = 80

[index]
# ANN index: "hnsw" (lower latency, more RAM) or "diskann" (disk-resident, low RAM)
method = "hnsw"
# Keep scanning until top_k rows survive the filter, rather than stopping after
# ef_search candidates. Leave on unless you are on pgvector older than 0.8,
# where it is ignored anyway.
hnsw_iterative_scan = "relaxed_order"
# maintenance_work_mem for index builds only. PostgreSQL's 64MB default makes an
# HNSW build spill to disk and slow sharply; lower this on a small server.
build_memory = "2GB"

[search]
# Search meaning and exact words together. Without this, a query that is a rare
# exact token -- an author surname, an acronym, an equation label -- finds the
# right document in the top 10 about 5% of the time; with it, essentially always.
hybrid = true
# A single-word query matching at most this many documents is answered from the
# exact-match ranking; anything broader is led by vector search. A word in
# thousands of documents does not identify one, so famous names do not qualify.
lexical_lead_max_documents = 20

[llama_cpp]
# Model identity is the file's content digest, so any spelling of the path
# that resolves to the same file is the same profile. Pointing at a
# *different* file re-embeds the corpus.
model_path = "models/nomic-embed-text-v2-moe.Q8_0.gguf"
# cementic spawns and supervises an OpenAI-compatible embedding server. By
# default that is `llama-server` on PATH; override this to name a specific
# build (e.g. a Vulkan one for a GPU) or to add flags. `embedding
# start/stop/status`, on-demand autostart, and crashed-daemon recovery apply
# either way -- there is no separate built-in server they behave differently for.
# Placeholders per argument:
#   {model} {alias} {host} {port} {n_ctx} {n_gpu_layers} {verbosity}
# Needs an env var? Prefix with env(1), as the LD_LIBRARY_PATH line shows.
# daemon_command = [
#   "env", "LD_LIBRARY_PATH=/path/to/llama.cpp/build",
#   "/path/to/llama-server",
#   "--host", "{host}", "--port", "{port}",
#   "--model", "{model}", "--alias", "{alias}",
#   "--embeddings",
#   "--ctx-size", "{n_ctx}", "--batch-size", "{n_ctx}", "--ubatch-size", "{n_ctx}",
#   "--n-gpu-layers", "99",
# ]

[extraction]
use_ocr = false

# Optional: extract a file type with an external command instead of a built-in
# extractor. Contract: argv in, text on stdout, nothing else. A tool that writes
# files (ocrmypdf) needs a wrapper script that prints. Naming a type here also
# makes it indexable, so this is how to add a type cementic has no extractor for.
# command_versions is required for every entry: its output enters the extraction
# fingerprint, so upgrading the tool re-versions revisions rather than silently
# changing extracted text. It cannot be inferred -- `pdftotext -v` works while
# `pdftotext --version` prints an error and exits 0.
# [extraction.backends] pdf = "command"
# [extraction.commands]
# pdf = ["pdftotext", "-layout", "{path}", "-"]
# [extraction.command_versions]
# pdf = ["pdftotext", "-v"]

# Optional: choose a specific extractor per file type. Unset types use the
# registry default. Keys are bare file types; values are registered extractor
# names (currently for pdf: "pymupdf4llm" (default, layout-aware Markdown) or
# "pymupdf-raw" (text layer only, ~275x faster -- see README, "Choosing a PDF
# extractor"); "plaintext" for txt/md/markdown).
[extraction.backends]
# pdf = "pymupdf4llm"
