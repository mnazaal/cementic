# cementic configuration
#
# Precedence (low -> high): built-in defaults < this file < CEMENTIC_* env vars
# < command-line flags. Every setting is shown below; delete a value to use its
# built-in default instead.

[database]
# Postgres with the pgvector and pgvectorscale extensions. Generate a local
# setup with `cementic init postgres ./cementic-postgres`, then start it with
# `docker compose up -d` (or `podman compose up -d`).
host = "localhost"
port = 5432
name = "cementic"
user = "cementic"
password = "cementic" # Override outside local development.
# url_override = "postgresql://user:password@host:5432/database"
# `url_override` wins over the settings above.

[pipeline]
embedding_provider = "llama-cpp"
# Counted with tiktoken, while llama_cpp.n_ctx counts the model's tokenizer.
# Keep this well below n_ctx; the default 320/512 pair has measured margin.
chunk_size = 320
chunk_overlap = 80

[index]
# "hnsw" has lower query latency and uses more RAM. "diskann" is disk-resident.
method = "hnsw"
hnsw_m = 16
hnsw_ef_construction = 64
hnsw_ef_search = 100
# "off", "relaxed_order", or "strict_order"; pgvector 0.8+ is required.
hnsw_iterative_scan = "relaxed_order"
diskann_num_neighbors = 50
diskann_search_list_size = 100
diskann_query_rescore = 50
# PostgreSQL maintenance_work_mem used only during index builds.
build_memory = "2GB"

[search]
# Combine semantic and exact-word search.
hybrid = true
lexical_lead_max_documents = 20

[llama_cpp]
# cementic starts and supervises an OpenAI-compatible embedding server. Point
# daemon_command at a GPU-capable llama-server build to use one.
model_path = "models/nomic-embed-text-v2-moe.Q8_0.gguf"
n_ctx = 512
n_gpu_layers = 0
embedding_dim = 768 # Fallback only; the live model is probed.
verbose = false
daemon_host = "127.0.0.1"
daemon_port = 11555
daemon_start_timeout_seconds = 120
llama_embed_timeout_seconds = 120
daemon_autostart = true
# daemon_pid_file = "~/.local/share/cementic/llama_cpp_daemon.pid"
# daemon_log_file = "~/.local/share/cementic/llama_cpp_daemon.log"
# The default is `llama-server` on PATH with this model, alias, host, port,
# context, GPU-layer, and verbosity configuration. Override it with argv when
# needed. Available placeholders: {model}, {alias}, {host}, {port}, {n_ctx},
# {n_gpu_layers}, {verbosity}.
# daemon_command = [
#   "llama-server", "--host", "{host}", "--port", "{port}",
#   "--model", "{model}", "--alias", "{alias}", "--embeddings",
#   "--ctx-size", "{n_ctx}", "--batch-size", "{n_ctx}",
#   "--ubatch-size", "{n_ctx}", "--n-gpu-layers", "{n_gpu_layers}",
#   "--verbosity", "{verbosity}",
# ]

[extraction]
# Enable OCR only with the layout-aware PDF extractor and optional rapidocr.
use_ocr = false
# Use per-type tables for overrides. Unset types use the registry default.
# [extraction.backends]
# pdf = "pymupdf-raw" # The default is "pymupdf4llm".
# [extraction.commands]
# epub = ["your-extractor", "{path}"]
# [extraction.command_versions]
# epub = ["your-extractor", "--version"]
# Every command needs a matching version command. Commands write text to stdout.

[storage]
# artifacts_path = "~/.local/share/cementic/artifacts"
# The default is under cementic's platform-specific user data directory.

[source_watcher]
# log_file = "~/.local/share/cementic/source_watcher.log"
# state_path = "~/.local/share/cementic/source_watcher_state.json"
# Replaces the defaults. Set [] to index every directory.
ignore_directories = [
  ".bzr", ".git", ".hg", ".mypy_cache", ".pytest_cache", ".ruff_cache",
  ".svn", ".tox", ".venv", "__pycache__", "build", "dist", "node_modules",
  "site-packages", "target", "venv",
]

[pipeline_worker]
# log_file = "~/.local/share/cementic/pipeline_worker.log"
# state_path = "~/.local/share/cementic/pipeline_worker_state.json"
batch_size = 32
# Limits per-request indexing work while a recent search has priority.
embed_submit_batch_size = 4
poll_interval = 1.0
search_lease_ttl_seconds = 10.0 # Set 0 to disable search priority.
search_yield_cap_seconds = 60.0

[bootstrap]
# Download a missing model only when its path is under cementic's user data
# directory. A model path outside cementic's user data directory must already
# exist; cementic will not download there.
auto_download_llama_model = true
llama_model_url = "https://huggingface.co/nomic-ai/nomic-embed-text-v2-moe-GGUF/resolve/main/nomic-embed-text-v2-moe.Q8_0.gguf"
# Set this to "" to disable integrity verification for a custom model URL.
llama_model_sha256 = "06e7a7e594a26985523c18383aba4aad39fe6e14f08ffc6ab5b554e1ccdc3cff"
