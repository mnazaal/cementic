# Postgres (with pgvector + vectorscale) for cementic.
#
# Dev/local compose file for cementic development. Installed users should run
# `cementic init postgres ./cementic-postgres` instead, which generates a
# self-contained setup directory with its own compose, Containerfile, and docs.
#
# Use whichever engine you have — docker or podman:
#
#   docker compose up -d     (or: podman compose up -d)    # start
#   docker compose down      (or: podman compose down)     # stop and remove
#   docker compose ps        (or: podman compose ps)       # check status
#
# Uses the same CEMENTIC_DB_* environment variables as the CLI, with
# local-development defaults (user/db/password: cementic, port: 5432).
#
# The postgres service builds from containers/postgres-vectorscale/Containerfile.
# First build: docker compose build   (or: podman compose build)

services:
  postgres:
    build:
      context: .
      dockerfile: containers/postgres-vectorscale/Containerfile
      args:
        POSTGRES_BASE_IMAGE: docker.io/postgres:18.3-bookworm
        PGVECTORSCALE_VERSION: "0.9.0"
    image: cementic-postgres-vectorscale:latest
    container_name: cementic-postgres
    environment:
      POSTGRES_USER: ${CEMENTIC_DB_USER:-cementic}
      POSTGRES_PASSWORD: ${CEMENTIC_DB_PASSWORD:-cementic}
      POSTGRES_DB: ${CEMENTIC_DB_NAME:-cementic}
    ports:
      - "127.0.0.1:${CEMENTIC_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18's image manages its own major-version subdirectory under
      # /var/lib/postgresql -- mounting a volume at .../data directly conflicts
      # with that scheme, so the volume must cover the parent dir.
      #
      # Without this named volume the whole database lives in the container's
      # writable layer, and the `compose down` documented above would delete
      # every indexed document, chunk and embedding.
      - cementic-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CEMENTIC_DB_USER:-cementic}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cementic-postgres-data:
