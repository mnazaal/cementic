name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job takes its interpreter from setup-uv's `python-version`, which sets
# UV_PYTHON -- and UV_PYTHON does override the repo's `.python-version`.
# actions/setup-python used to sit here pinned to 3.12 and did nothing: uv
# honours `.python-version` (3.13) over whatever is on PATH, so the workflow
# named one version and ran another. That is how a 3.13-only failure
# (ResourceWarning on unclosed sqlite connections) reached a CI job that
# claimed to be 3.12.

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the other's result.
      fail-fast: false
      matrix:
        # 3.12 is the floor `requires-python` promises; 3.13 is what
        # `.python-version` pins for local work. Only this job runs both --
        # it is the cheapest, and the integration jobs' cost is in Postgres
        # and the compose image, not in the interpreter.
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: SQLite-backed integration tests
        run: uv run pytest tests/integration -m "not pg"

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      # Do not sync the lockfile here: this job checks what a fresh CLI install
      # resolves, including newer SQLAlchemy releases.
      - name: Build and install an unlocked wheel
        run: |
          uv build
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/cementic-*.whl
      - name: Smoke-test the installed CLI and default driver
        run: |
          .smoke-venv/bin/python - <<'PY'
          import os
          import subprocess
          from cementic.config import DatabaseConfig
          from cementic.db import get_engine
          from sqlalchemy import __version__ as sqlalchemy_version

          print(f"Installed SQLAlchemy: {sqlalchemy_version}")
          for url in (DatabaseConfig().url, "postgresql://u:p@127.0.0.1:1/test"):
              engine = get_engine(url)
              assert engine.dialect.driver == "psycopg", engine.dialect.driver
              engine.dispose()
          env = {**os.environ, "CEMENTIC_DB_URL": "postgresql://u:p@127.0.0.1:1/test"}
          result = subprocess.run(
              [".smoke-venv/bin/cementic", "collection", "list"],
              env=env, capture_output=True, text=True, timeout=15,
          )
          assert result.returncode == 1, (result.returncode, result.stderr)
          assert "database not reachable" in result.stderr, result.stderr
          PY

  integration-pg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: PostgreSQL-backed integration tests
        # The pg_engine fixture builds and brings up compose.yml's
        # pgvector+vectorscale image itself (first build compiles the
        # extension from source, so this job is slower than the others).
        run: |
          uv run pytest tests/integration -m pg --junitxml=pg-locked.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites = list(ElementTree.parse('pg-locked.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', '0')) for s in suites) > 0
          assert sum(int(s.get('skipped', '0')) for s in suites) == 0, 'PostgreSQL tests skipped'
          PY

      - name: Install latest supported SQLAlchemy without changing the lockfile
        run: uv pip install --python .venv/bin/python --upgrade 'sqlalchemy>=2.1'

      - name: PostgreSQL-backed integration tests with newer SQLAlchemy
        # Reuse the already-built container; --no-sync preserves the newer
        # package instead of restoring the locked version before pytest starts.
        run: |
          uv run --no-sync pytest tests/integration -m pg --junitxml=pg-newer.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites = list(ElementTree.parse('pg-newer.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', '0')) for s in suites) > 0
          assert sum(int(s.get('skipped', '0')) for s in suites) == 0, 'PostgreSQL tests skipped'
          PY
