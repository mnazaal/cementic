[project]
name = "cementic"
version = "0.2.0"
description = "Semantic search CLI tool with pgvectorscale"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "mnazaal", email = "mnazaal@users.noreply.github.com"}]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "semantic-search",
    "pdf",
    "embeddings",
    "pgvector",
    "llama-cpp",
    "cli",
    "vector-search",
    "rag",
    "document-indexing",
]

dependencies = [
    # Upper bound is intentional: typer 0.26 reworks the Context/HelpFormatter
    # internals cli.py's _UpperContext/_UpperFormatter subclass, which crashes
    # --help/--version. Bump only after verifying against 0.26+.
    "typer>=0.12.0,<0.26",
    # Imported directly by cli.py, which subclasses click.HelpFormatter and
    # click.Context -- the same internals the typer bound above protects. It
    # arrived transitively through typer, so the constraint was implicit.
    "click>=8.1,<9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.0",
    "watchdog>=4.0",
    "pymupdf4llm>=0.0.5",
    # Imported directly by extract.py (including the layout-activation check),
    # not just pulled in by pymupdf4llm.
    "pymupdf>=1.27.1",
    "pymupdf-layout>=1.27.1",
    # rapidocr is deliberately *not* declared here. cementic never imports it:
    # extract.py looks it up through pymupdf4llm and hands its exec_ocr over as
    # a callback, and that path is only reachable with the pymupdf4llm backend
    # and extraction.use_ocr on -- neither of which is the default. Declaring it
    # put 252 MB of opencv and its ONNX runtime into every install for a path
    # most installs never take. Opt in at install time instead:
    #   uv tool install --with 'rapidocr>=3.6.0' <cementic>
    # The >=3.6.0 floor is carried over from when this was declared; moving it
    # out of the resolver means nothing enforces it at install time, so
    # extract.py's error message states it to whoever has to act on it.
    "requests>=2.31.0",
    "rich>=13.0",
    "platformdirs>=4.0",
    "tiktoken>=0.5.0",
    # No llama.cpp Python binding is declared, and none is imported. cementic
    # spawns an OpenAI-compatible embedding server and talks to it over HTTP,
    # so llama.cpp is a system prerequisite like Postgres -- see
    # config.DEFAULT_DAEMON_COMMAND. That also removes a second ggml build from
    # the install, which could differ from the binary actually serving, and a
    # source build on any platform without a prebuilt wheel.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "coverage>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "reportlab>=4.0",
]

[project.scripts]
cementic = "cementic.cli:main"

[project.urls]
Homepage = "https://github.com/mnazaal/cementic"
Repository = "https://github.com/mnazaal/cementic.git"
Issues = "https://github.com/mnazaal/cementic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cementic"]

[tool.hatch.build.targets.wheel.force-include]
"src/cementic/templates/postgres/.env" = "cementic/templates/postgres/.env"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".envrc",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.hatch.build.targets.sdist.force-include]
"src/cementic/templates/postgres/.env" = "src/cementic/templates/postgres/.env"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures/generate_pdfs.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "pg: tests requiring a running PostgreSQL container (podman compose up -d)",
]

[tool.coverage.run]
source = ["cementic"]
relative_files = true
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
