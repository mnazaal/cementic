[project]
name = "cementic"
version = "0.1.0"
description = "Semantic search CLI tool with pgvectorscale"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "mnazaal", email = "mnazaal@users.noreply.github.com"}]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "semantic-search",
    "pdf",
    "embeddings",
    "pgvector",
    "llama-cpp",
    "cli",
    "vector-search",
    "rag",
    "document-indexing",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
    "watchdog>=4.0",
    "pymupdf4llm>=0.0.5",
    "pymupdf-layout>=1.27.1",
    "rapidocr>=3.6.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "platformdirs>=4.0",
    "tiktoken>=0.5.0",
    "llama-cpp-python[server]>=0.2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0",
    "coverage>=7.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "tomli>=2.0",
    "reportlab>=4.0",
]

[project.scripts]
cementic = "cementic.cli:main"

[project.urls]
Homepage = "https://github.com/mnazaal/cementic"
Repository = "https://github.com/mnazaal/cementic.git"
Issues = "https://github.com/mnazaal/cementic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cementic"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".envrc",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/fixtures/generate_pdfs.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "pg: tests requiring a running PostgreSQL container (podman compose up -d)",
    "container: tests requiring podman for container start/stop",
    "daemon: tests requiring a real daemon subprocess",
]

[tool.coverage.run]
source = ["cementic"]
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
